<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Asta" />
  <meta name="theme-color" content="#0f1419" />
  <!-- Manifest e icone servono solo se il file sta online: aperto da locale vengono ignorati -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <title>Asta Fantacalcio</title>
  <style>
    :root {
      --bg: #0f1419;
      --bg2: #1a222c;
      --bg3: #243040;
      --card: #1c2530;
      --text: #f2f5f8;
      --muted: #9aa8b8;
      --border: #2e3c4d;
      --accent: #5b9fd4;
      --mine: #2ecc71;
      --taken: #e74c3c;
      --like: #f1c40f;
      --risk: #e67e22;
      --bonus: #8e6cc9;
      --p: #4fc3f7;
      --d: #66bb6a;
      --c: #ffa726;
      --a: #ef5350;
      --danger: #ff6b6b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 118px;
      --tools-h: 78px;
      --radius: 14px;
      --touch: 52px;
      --card-min: 152px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
    }

    header {
      flex: 0 0 auto;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px 8px;
      z-index: 20;
    }

    .top-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .credits-chip {
      flex: 0 0 auto;
      min-width: 72px;
      height: 44px;
      border-radius: 22px;
      border: 2px solid var(--accent);
      background: var(--bg3);
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .credits-chip:active { background: #2c3a4d; }

    .credits-readout {
      flex: 0 0 auto;
      min-width: 72px;
      height: 44px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      pointer-events: none;
    }
    .credits-readout.over { border-color: var(--danger); color: var(--danger); }
    .credits-readout .label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .credits-readout.over .label { color: var(--danger); }

    .plans-chip {
      flex: 0 0 auto;
      min-width: 78px;
      height: 44px;
      border-radius: 22px;
      border: 2px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      cursor: pointer;
    }
    .plans-chip:active { background: #2c3a4d; }
    .plans-chip .plan-label { font-size: 11px; font-weight: 700; color: var(--accent); }
    .plans-chip .plan-label:empty { display: none; }

    .mode-chip {
      flex: 0 0 auto;
      min-width: 62px;
      height: 44px;
      border-radius: 22px;
      border: 2px solid var(--accent);
      background: rgba(91,159,212,.16);
      color: var(--text);
      font-weight: 800;
      font-size: 15px;
      padding: 0 12px;
      cursor: pointer;
    }

    .search-wrap { flex: 1; position: relative; }
    .search-wrap input {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      padding: 0 40px 0 14px;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-clear {
      position: absolute; right: 6px; top: 6px;
      width: 32px; height: 32px;
      border: none; border-radius: 8px;
      background: transparent; color: var(--muted);
      font-size: 18px; cursor: pointer;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .role-tab {
      min-width: 0;
      overflow: hidden;
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      padding: 5px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .role-tab .role-residual { min-height: 13px; font-size: 11px; font-weight: 800; color: var(--text); }
    .role-tab .role-residual.empty { visibility: hidden; }
    .role-tab .role-residual.over { color: var(--danger); }
    .role-tab.active[data-role="P"] { background: rgba(79,195,247,.18); color: var(--p); border-color: var(--p); }
    .role-tab.active[data-role="D"] { background: rgba(102,187,106,.18); color: var(--d); border-color: var(--d); }
    .role-tab.active[data-role="C"] { background: rgba(255,167,38,.18); color: var(--c); border-color: var(--c); }
    .role-tab.active[data-role="A"] { background: rgba(239,83,80,.18); color: var(--a); border-color: var(--a); }

    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px calc(var(--tools-h) + var(--safe-bottom) + 16px);
    }

    .tier {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .tier.bonus { border-color: var(--bonus); }
    .tier-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }
    .tier-head:active { background: #2c3a4d; }
    .tier.bonus .tier-head { color: var(--bonus); }
    .tier-meta { display: flex; align-items: center; gap: 8px; }
    .tier-value { font-weight: 800; font-size: 12px; color: var(--accent); text-transform: none; }
    .tier-value.empty { color: var(--muted); font-weight: 600; opacity: .7; }
    .tier-count { font-weight: 600; font-size: 12px; opacity: .8; }

    /* Griglia di card: quante ne stanno per riga lo decide la larghezza dello schermo */
    .tier-body {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      gap: 8px;
      padding: 10px;
      align-items: stretch;
    }

    .player {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 76px;
      padding: 10px 12px 10px 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: transform .1s ease, background .12s, border-color .12s, box-shadow .12s;
    }
    .player-main {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      flex: 1;
      align-self: stretch;
    }
    .player:active { transform: scale(.97); }
    .player.mine {
      background: rgba(46,204,113,.14);
      border-color: rgba(46,204,113,.6);
    }
    .player.taken {
      background: rgba(231,76,60,.12);
      border-color: rgba(231,76,60,.5);
    }
    .player.liked {
      border-color: var(--like);
      box-shadow: 0 0 0 1px var(--like), 0 0 12px rgba(241,196,15,.22);
    }
    .player.hidden-row { opacity: .45; }

    .player-name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player.mine .player-name { color: var(--mine); }
    .player.taken .player-name { color: var(--taken); }

    .player-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      min-height: 24px;
    }
    .player-team {
      font-size: 12px;
      color: var(--muted);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-fvm {
      flex: 0 0 auto;
      align-self: center;
      min-width: 2.25ch;
      text-align: right;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }
    .player.taken .player-fvm { color: #c5d0db; }
    .player.mine .player-fvm { color: var(--mine); }
    .badges { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
    .badge {
      min-width: 24px; height: 24px;
      border-radius: 7px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
    }
    .badge.risk { background: rgba(230,126,34,.25); color: var(--risk); border: 1px solid var(--risk); }
    .badge.like { background: rgba(241,196,15,.2); color: var(--like); border: 1px solid var(--like); }
    .badge.mine { background: rgba(46,204,113,.2); color: var(--mine); border: 1px solid var(--mine); font-size: 11px; padding: 0 6px; min-width: auto; }
    .badge.taken { background: rgba(231,76,60,.2); color: var(--taken); border: 1px solid var(--taken); font-size: 11px; padding: 0 6px; min-width: auto; }

    /* Schermi molto stretti: card più basse per non perdere righe */
    @media (max-width: 380px) {
      :root { --card-min: 128px; }
      .player-name { font-size: 16px; }
      .player-fvm { font-size: 20px; }
      .tool { font-size: 10px; }
      .credits-chip { min-width: 62px; padding: 0 10px; font-size: 14px; }
      .credits-readout { min-width: 64px; padding: 0 8px; font-size: 14px; }
      .plans-chip { min-width: 62px; padding: 0 10px; font-size: 13px; }
      .mode-chip { min-width: 54px; padding: 0 8px; font-size: 13px; }
    }
    /* iPad in verticale e oltre: card più larghe e nomi più grandi */
    @media (min-width: 700px) {
      :root { --card-min: 172px; }
      .player-name { font-size: 18px; }
      .player-team { font-size: 13px; }
      .player-fvm { font-size: 26px; }
    }
    @media (min-width: 1100px) {
      :root { --card-min: 190px; }
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 48px 20px;
      font-size: 16px;
    }

    .toolbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 8px 8px calc(8px + var(--safe-bottom));
      background: rgba(26,34,44,.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }
    .tool {
      min-width: 0;
      overflow: hidden;
      min-height: 58px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      line-height: 1.1;
    }
    .tool .ico { font-size: 18px; line-height: 1; }
    .tool.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(91,159,212,.2);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .tool[data-tool="taken"].active { border-color: var(--taken); background: rgba(231,76,60,.2); box-shadow: 0 0 0 1px var(--taken); }
    .tool[data-tool="mine"].active { border-color: var(--mine); background: rgba(46,204,113,.2); box-shadow: 0 0 0 1px var(--mine); }
    .tool[data-tool="like"].active { border-color: var(--like); background: rgba(241,196,15,.18); box-shadow: 0 0 0 1px var(--like); color: #fff; }
    .tool[data-tool="risk"].active { border-color: var(--risk); background: rgba(230,126,34,.2); box-shadow: 0 0 0 1px var(--risk); }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    .sheet {
      width: 100%;
      max-width: 720px;
      max-height: min(88vh, 900px);
      background: var(--bg2);
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-bottom);
      animation: slideUp .22s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: .6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .sheet-head h2 { margin: 0; font-size: 18px; }
    .sheet-actions { display: flex; gap: 8px; }
    .btn {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      padding: 0 14px;
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #061018; }
    .btn.danger { background: rgba(231,76,60,.2); border-color: var(--taken); color: #ffb4ae; }
    .btn.ghost { background: transparent; }

    .sheet-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px 24px;
    }

    .roster-summary {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      padding: 12px 16px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 16px -8px rgba(0,0,0,.45);
      z-index: 1;
    }
    .stat {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat .v { font-size: 22px; font-weight: 800; }
    .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
    .stat.over .v { color: var(--danger); }

    .roster-role { margin-bottom: 16px; }
    .roster-role h3 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
    }
    .roster-plan-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: -3px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .roster-plan-line .over { color: var(--danger); font-weight: 700; }
    .plan-progress {
      height: 5px;
      margin-bottom: 9px;
      overflow: hidden;
      border-radius: 3px;
      background: var(--bg3);
    }
    .plan-progress > span { display: block; height: 100%; background: var(--mine); border-radius: inherit; }
    .plan-progress.over > span { background: var(--danger); }
    .slot {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px 12px;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .slot.filled {
      border-style: solid;
      border-color: rgba(46,204,113,.45);
      background: rgba(46,204,113,.08);
    }
    .slot-idx {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--bg3);
      color: var(--muted);
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .slot-info { flex: 1; min-width: 0; }
    .slot-name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-empty { color: var(--muted); font-size: 14px; }
    .slot-team { font-size: 12px; color: var(--muted); }
    .slot-credits {
      font-weight: 800;
      font-size: 16px;
      color: var(--mine);
      min-width: 42px;
      text-align: right;
    }

    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .modal-card h3 { margin: 0 0 6px; font-size: 18px; }
    .modal-sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .credits-display {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 8px 0 14px;
      min-height: 52px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .key {
      height: 52px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .key:active { background: var(--accent); color: #061018; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { flex: 1; height: 48px; font-size: 16px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 18px; }
    .field label, .plan-row label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .field input, .plan-row input, .plan-name {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .field input:focus, .plan-row input:focus, .plan-name:focus { border-color: var(--accent); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tools-h) + var(--safe-bottom) + 18px);
      transform: translateX(-50%) translateY(20px);
      background: #2a3644;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 60;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .meta-bar button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
    }
    .meta-left { min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; }
    #dataStampLabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #activePlanBtn { white-space: nowrap; color: var(--accent); font-weight: 700; }
    #planUnitBtn {
      min-width: 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      color: var(--text);
    }
    .meta-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .plan-picker-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .plan-chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 10px;
      padding-bottom: 16px;
    }
    .plan-chip {
      min-height: 54px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      color: var(--muted);
      padding: 8px 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

(() => {
  const ROLE_LABELS = { P: "Portieri", D: "Difensori", C: "Centrocampisti", A: "Attaccanti" };
  const ROLE_SHORT = { P: "Porta", D: "Difesa", C: "Centrocampo", A: "Attacco" };
  const ROLES = ["P", "D", "C", "A"];
  const MODE_KEY = "fantaAstaMode";
  const LEGACY_STORAGE_KEY = "fantaAstaState_v1";
  const MODE_CONFIG = {
    300: {
      budget: 300,
      slots: { P: 2, D: 9, C: 9, A: 6 },
      fasciaCount: { D: 9, C: 9, A: 6 },
    },
    500: {
      budget: 500,
      slots: { P: 3, D: 8, C: 8, A: 6 },
      fasciaCount: { D: 8, C: 8, A: 6 },
    },
  };
  let currentMode = null;

  function cfg() {
    return MODE_CONFIG[currentMode] || MODE_CONFIG[300];
  }
  function budget() {
    return cfg().budget;
  }
  function quotedFvm(p) {
    const raw = Number(p && p.fvm);
    if (!Number.isFinite(raw)) return 0;
    return Math.round(raw * budget() / 1000);
  }
  function slotCap(role) {
    return cfg().slots[role];
  }
  function slotTotal() {
    return ROLES.reduce((sum, role) => sum + slotCap(role), 0);
  }
  function storageKey() {
    return `fantaAstaState_${currentMode}`;
  }

  const state = {
    role: "P",
    tool: "taken",
    query: "",
    showHidden: false,
    flags: {},   // id -> { taken, mine, liked, risk, hidden }
    roster: [],  // { id, role, credits }
    plans: [],
    activePlanId: null,
    planUnit: "cr",
    tierValues: {},
    planEditUnit: "cr",
    pendingMineId: null,
    editingRosterId: null,
    creditInput: "",
    pendingTierRole: null,
    pendingTierKey: null,
  };

  const $ = (sel) => document.querySelector(sel);
  const listEl = $("#list");
  const toastEl = $("#toast");
  let toastTimer = null;
  let storageWarned = false;

  function allPlayersFlat() {
    const out = [];
    for (const p of PLAYERS.P || []) out.push({ ...p, r: "P" });
    for (const role of ["D", "C", "A"]) {
      const block = PLAYERS[role] || { tiers: [], bonus: [] };
      for (const tier of block.tiers || []) {
        for (const p of tier) out.push({ ...p, r: role });
      }
      for (const p of block.bonus || []) out.push({ ...p, r: role });
    }
    return out;
  }

  function playerMap() {
    const m = new Map();
    for (const p of allPlayersFlat()) m.set(String(p.id), p);
    return m;
  }

  function getFlags(id) {
    const k = String(id);
    if (!state.flags[k]) {
      state.flags[k] = { taken: false, mine: false, liked: false, risk: false, hidden: false };
    }
    return state.flags[k];
  }

  function spent() {
    return state.roster.reduce((s, x) => s + (Number(x.credits) || 0), 0);
  }

  function spentByRole(role) {
    return state.roster
      .filter((x) => x.role === role)
      .reduce((sum, x) => sum + (Number(x.credits) || 0), 0);
  }

  function activePlan() {
    return state.plans.find((plan) => plan.id === state.activePlanId) || null;
  }

  function planRemaining(role) {
    const plan = activePlan();
    return plan ? (Number(plan.alloc[role]) || 0) - spentByRole(role) : null;
  }

  function remaining() {
    return budget() - spent();
  }

  function roleBlock(role) {
    const src = PLAYERS[role] || { tiers: [], bonus: [] };
    const keep = cfg().fasciaCount[role];
    if (keep == null) return src;
    const allTiers = src.tiers || [];
    const extra = allTiers.slice(keep).flat();
    return {
      tiers: allTiers.slice(0, keep),
      bonus: extra.concat(src.bonus || []),
    };
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  function save() {
    if (!currentMode) return;
    const payload = {
      dataStamp: PLAYERS.dataStamp || "",
      role: state.role,
      tool: state.tool,
      showHidden: state.showHidden,
      flags: state.flags,
      roster: state.roster,
      plans: state.plans,
      activePlanId: state.activePlanId,
      planUnit: state.planUnit,
      tierValues: state.tierValues,
    };
    try {
      localStorage.setItem(storageKey(), JSON.stringify(payload));
    } catch (_) {
      // Avvisa una sola volta: senza salvataggio l'asta si perde chiudendo la pagina
      if (!storageWarned) {
        storageWarned = true;
        toast("Salvataggio non disponibile: non chiudere la pagina");
      }
    }
  }

  function reconcile(saved) {
    const map = playerMap();
    const validIds = new Set(map.keys());
    const flags = {};
    for (const [id, f] of Object.entries(saved.flags || {})) {
      if (validIds.has(String(id))) flags[String(id)] = {
        taken: !!f.taken,
        mine: !!f.mine,
        liked: !!f.liked,
        risk: !!f.risk,
        hidden: !!f.hidden,
      };
    }
    const roster = [];
    for (const slot of saved.roster || []) {
      const id = String(slot.id);
      if (!validIds.has(id)) continue;
      const p = map.get(id);
      roster.push({
        id: p.id,
        role: p.r,
        credits: Math.max(0, Math.floor(Number(slot.credits) || 0)),
      });
      const f = flags[id] || { taken: false, mine: false, liked: false, risk: false, hidden: false };
      f.mine = true;
      f.taken = false;
      flags[id] = f;
    }
    // Cap roster by role
    const byRole = { P: [], D: [], C: [], A: [] };
    for (const s of roster) {
      if ((byRole[s.role] || []).length < slotCap(s.role)) byRole[s.role].push(s);
    }
    return {
      flags,
      roster: [...byRole.P, ...byRole.D, ...byRole.C, ...byRole.A],
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(storageKey());
      if (!raw) return;
      const saved = JSON.parse(raw);
      const { flags, roster } = reconcile(saved);
      state.flags = flags;
      state.roster = roster;
      if (saved.role && ROLE_LABELS[saved.role]) state.role = saved.role;
      if (saved.tool) state.tool = saved.tool;
      state.showHidden = !!saved.showHidden;
      state.plans = (Array.isArray(saved.plans) ? saved.plans : []).map((plan, idx) => ({
        id: String(plan.id || `p${idx + 1}`),
        name: String(plan.name || `Piano ${idx + 1}`).slice(0, 60),
        alloc: Object.fromEntries(ROLES.map((role) => [
          role,
          Math.max(0, Math.round(Number(plan.alloc && plan.alloc[role]) || 0)),
        ])),
      }));
      const savedActivePlanId = saved.activePlanId == null ? null : String(saved.activePlanId);
      state.activePlanId = state.plans.some((plan) => plan.id === savedActivePlanId)
        ? savedActivePlanId
        : null;
      state.planUnit = saved.planUnit === "pct" ? "pct" : "cr";
      state.tierValues = saved.tierValues && typeof saved.tierValues === "object" ? saved.tierValues : {};
    } catch (_) { /* ignore */ }
  }

  function updateCreditsChip() {
    const left = remaining();
    const readout = $("#creditsReadout");
    $("#creditsLeft").textContent = String(left);
    $("#creditsBudgetLabel").textContent = `/${budget()}`;
    readout.classList.toggle("over", left < 0);
  }

  function updateToolbar() {
    document.querySelectorAll(".tool").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.tool === state.tool);
    });
  }

  function updateRoleTabs() {
    const plan = activePlan();
    document.querySelectorAll(".role-tab").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.role === state.role);
      const residual = btn.querySelector(".role-residual");
      if (!residual) return;
      if (!plan) {
        residual.textContent = "";
        residual.className = "role-residual empty";
        return;
      }
      const role = btn.dataset.role;
      const rem = planRemaining(role);
      const alloc = Number(plan.alloc[role]) || 0;
      residual.textContent = state.planUnit === "pct"
        ? (alloc ? `${Math.round(rem / alloc * 100)}%` : "—")
        : String(rem);
      residual.className = `role-residual${rem < 0 ? " over" : ""}`;
    });
  }

  function updatePlanUi() {
    const plan = activePlan();
    const activeBtn = $("#activePlanBtn");
    const unitBtn = $("#planUnitBtn");
    const plansLabel = $("#plansBtnPlan");
    activeBtn.style.display = plan ? "" : "none";
    unitBtn.style.display = plan ? "" : "none";
    if (plansLabel) plansLabel.textContent = plan ? plan.name : "";
    if (plan) {
      activeBtn.textContent = `${plan.name} ·`;
      unitBtn.textContent = state.planUnit === "pct" ? "%" : "cr";
    }
  }

  function matchesQuery(p, q) {
    if (!q) return true;
    const hay = `${p.nome} ${p.squadra}`.toLowerCase();
    return hay.includes(q);
  }

  function renderList() {
    const q = state.query.trim().toLowerCase();
    const role = state.role;
    let html = "";

    html += `<div class="filter-bar">
      <button type="button" class="chip-toggle ${state.showHidden ? "on" : ""}" id="toggleHidden">
        ${state.showHidden ? "Nascondi nascosti" : "Mostra nascosti"}
      </button>
    </div>`;

    if (role === "P") {
      const players = (PLAYERS.P || []).filter((p) => {
        const f = getFlags(p.id);
        if (f.hidden && !state.showHidden) return false;
        return matchesQuery(p, q);
      });
      if (!players.length) {
        html += `<div class="empty-state">Nessun portiere trovato</div>`;
      } else {
        html += `<section class="tier">
          ${tierHead("P", "titolari", "Titolari (1 per squadra)", players.length)}
          <div class="tier-body">${players.map((p) => playerRow(p)).join("")}</div>
        </section>`;
      }
    } else {
      const block = roleBlock(role);
      let any = false;
      (block.tiers || []).forEach((tier, idx) => {
        const visible = tier.filter((p) => {
          const f = getFlags(p.id);
          if (f.hidden && !state.showHidden) return false;
          return matchesQuery(p, q);
        });
        if (!visible.length) return;
        any = true;
        html += `<section class="tier">
          ${tierHead(role, String(idx), `Fascia ${idx + 1}`, visible.length)}
          <div class="tier-body">${visible.map((p) => playerRow(p)).join("")}</div>
        </section>`;
      });
      const bonus = (block.bonus || []).filter((p) => {
        const f = getFlags(p.id);
        if (f.hidden && !state.showHidden) return false;
        return matchesQuery(p, q);
      });
      if (bonus.length) {
        any = true;
        html += `<section class="tier bonus">
          ${tierHead(role, "bonus", "Fascia bonus", bonus.length)}
          <div class="tier-body">${bonus.map((p) => playerRow(p)).join("")}</div>
        </section>`;
      }
      if (!any) html += `<div class="empty-state">Nessun giocatore trovato</div>`;
    }

    listEl.innerHTML = html;
    const th = $("#toggleHidden");
    if (th) {
      th.addEventListener("click", () => {
        state.showHidden = !state.showHidden;
        save();
        renderList();
      });
    }
  }

  function tierValue(role, key) {
    const value = state.tierValues[role] && state.tierValues[role][key];
    if (!value || !Number.isFinite(Number(value.min)) || !Number.isFinite(Number(value.max))) return null;
    return { min: Number(value.min), max: Number(value.max) };
  }

  function tierHead(role, key, label, count) {
    const value = tierValue(role, key);
    const range = value ? `${value.min}–${value.max}` : "valuta";
    return `<div class="tier-head" data-tier-role="${role}" data-tier-key="${key}">
      <span>${label}</span>
      <span class="tier-meta"><span class="tier-value ${value ? "" : "empty"}">${range}</span><span class="tier-count">· ${count}</span></span>
    </div>`;
  }

  function tierKeyForPlayer(p) {
    if (p.r === "P") return "titolari";
    const block = roleBlock(p.r);
    const id = String(p.id);
    const idx = (block.tiers || []).findIndex((tier) => tier.some((item) => String(item.id) === id));
    if (idx >= 0) return String(idx);
    return (block.bonus || []).some((item) => String(item.id) === id) ? "bonus" : null;
  }

  function tierLabel(role, key) {
    const name = key === "titolari" ? "Titolari" : key === "bonus" ? "Fascia bonus" : `Fascia ${Number(key) + 1}`;
    return `${name} · ${ROLE_LABELS[role]}`;
  }

  function playerRow(p) {
    const f = getFlags(p.id);
    const classes = ["player"];
    if (f.mine) classes.push("mine");
    if (f.taken) classes.push("taken");
    if (f.liked) classes.push("liked");
    if (f.hidden) classes.push("hidden-row");
    const badges = [];
    if (f.risk) badges.push(`<span class="badge risk">R</span>`);
    if (f.liked) badges.push(`<span class="badge like">★</span>`);
    if (f.mine) {
      const slot = state.roster.find((x) => String(x.id) === String(p.id));
      const cr = slot ? slot.credits : "";
      badges.push(`<span class="badge mine">${cr !== "" ? cr + " cr" : "MIO"}</span>`);
    } else if (f.taken) {
      badges.push(`<span class="badge taken">OUT</span>`);
    }
    const fvm = quotedFvm(p);
    return `<div class="${classes.join(" ")}" data-id="${p.id}" title="${escapeHtml(p.nome)} · ${escapeHtml(p.squadra)} · FVM ${fvm}">
      <div class="player-main">
        <div class="player-name">${escapeHtml(p.nome)}</div>
        <div class="player-foot">
          <span class="player-team">${escapeHtml(p.squadra)}</span>
          <span class="badges">${badges.join("")}</span>
        </div>
      </div>
      <div class="player-fvm">${fvm}</div>
    </div>`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function roleCount(role) {
    return state.roster.filter((x) => x.role === role).length;
  }

  function applyTool(id) {
    const map = playerMap();
    const p = map.get(String(id));
    if (!p) return;
    const f = getFlags(id);
    const tool = state.tool;

    if (tool === "taken") {
      if (f.mine) {
        removeFromRoster(id);
      }
      f.taken = !f.taken;
      if (f.taken) f.mine = false;
    } else if (tool === "mine") {
      if (f.mine) {
        openCreditsModal(p, true);
        return;
      }
      if (roleCount(p.r) >= slotCap(p.r)) {
        toast(`${ROLE_LABELS[p.r]}: rosa piena (${slotCap(p.r)})`);
        return;
      }
      openCreditsModal(p, false);
      return;
    } else if (tool === "hide") {
      f.hidden = !f.hidden;
    } else if (tool === "like") {
      f.liked = !f.liked;
    } else if (tool === "risk") {
      f.risk = !f.risk;
    } else if (tool === "clear") {
      if (f.mine) removeFromRoster(id);
      f.taken = false;
      f.mine = false;
      f.liked = false;
      f.risk = false;
      f.hidden = false;
    }

    save();
    updateCreditsChip();
    updateRoleTabs();
    renderList();
  }

  function removeFromRoster(id) {
    state.roster = state.roster.filter((x) => String(x.id) !== String(id));
    const f = getFlags(id);
    f.mine = false;
  }

  function addOrUpdateRoster(p, credits) {
    const id = String(p.id);
    const existing = state.roster.find((x) => String(x.id) === id);
    if (existing) {
      existing.credits = credits;
    } else {
      if (roleCount(p.r) >= slotCap(p.r)) {
        toast(`${ROLE_LABELS[p.r]}: rosa piena (${slotCap(p.r)})`);
        return false;
      }
      state.roster.push({ id: p.id, role: p.r, credits });
    }
    const f = getFlags(id);
    f.mine = true;
    f.taken = false;
    return true;
  }

  // Credits modal
  function openCreditsModal(p, isEdit) {
    state.pendingMineId = p.id;
    state.editingRosterId = isEdit ? p.id : null;
    const slot = state.roster.find((x) => String(x.id) === String(p.id));
    state.creditInput = slot ? String(slot.credits) : "";
    $("#creditsModalTitle").textContent = isEdit ? "Modifica crediti" : "Crediti spesi";
    const hints = [`${p.nome} · ${p.squadra}`];
    const plan = activePlan();
    if (plan) hints.push(`Piano ${ROLE_SHORT[p.r].toLowerCase()}: ${planRemaining(p.r)} rimasti`);
    const key = tierKeyForPlayer(p);
    const value = key == null ? null : tierValue(p.r, key);
    if (value) hints.push(`${tierLabel(p.r, key)}: ${value.min}–${value.max}`);
    $("#creditsModalSub").innerHTML = hints.map(escapeHtml).join("<br>");
    $("#creditsRemove").style.display = isEdit ? "" : "none";
    updateCreditsDisplay();
    $("#creditsModal").classList.add("open");
  }

  function closeCreditsModal() {
    $("#creditsModal").classList.remove("open");
    state.pendingMineId = null;
    state.editingRosterId = null;
    state.creditInput = "";
  }

  function updateCreditsDisplay() {
    $("#creditsDisplay").textContent = state.creditInput === "" ? "0" : state.creditInput;
  }

  function buildKeypad() {
    const keys = ["1","2","3","4","5","6","7","8","9","⌫","0","C"];
    const pad = $("#keypad");
    pad.innerHTML = keys.map((k) => `<button type="button" class="key" data-k="${k}">${k}</button>`).join("");
    pad.addEventListener("click", (e) => {
      const btn = e.target.closest(".key");
      if (!btn) return;
      const k = btn.dataset.k;
      if (k === "C") state.creditInput = "";
      else if (k === "⌫") state.creditInput = state.creditInput.slice(0, -1);
      else {
        if (state.creditInput.length >= 3) return;
        if (state.creditInput === "0") state.creditInput = k;
        else state.creditInput += k;
      }
      updateCreditsDisplay();
    });
  }

  function confirmCredits() {
    const map = playerMap();
    const p = map.get(String(state.pendingMineId));
    if (!p) { closeCreditsModal(); return; }
    const credits = Math.max(0, parseInt(state.creditInput || "0", 10) || 0);
    if (addOrUpdateRoster(p, credits)) {
      save();
      updateCreditsChip();
      updateRoleTabs();
      renderList();
      const roleRem = planRemaining(p.r);
      if (roleRem != null && roleRem < 0) toast(`${ROLE_SHORT[p.r]}: ${Math.abs(roleRem)} oltre il piano`);
      else if (remaining() < 0) toast(`Attenzione: budget oltre i ${budget()}`);
      closeCreditsModal();
      if ($("#rosterOverlay").classList.contains("open")) renderRoster();
    }
  }

  function renderRoster() {
    const map = playerMap();
    const rem = remaining();
    $("#rosterSummary").innerHTML = `
      <div class="stat"><div class="v">${spent()}</div><div class="k">Spesi</div></div>
      <div class="stat ${rem < 0 ? "over" : ""}"><div class="v">${rem}</div><div class="k">Rimasti</div></div>
      <div class="stat"><div class="v">${state.roster.length}/${slotTotal()}</div><div class="k">Giocatori</div></div>
    `;

    let html = "";
    const plan = activePlan();
    const rosterPlanBtn = $("#rosterPlanBtn");
    rosterPlanBtn.style.display = plan ? "" : "none";
    rosterPlanBtn.textContent = plan ? `Piano: ${plan.name}` : "";
    for (const role of ROLES) {
      const slots = state.roster.filter((x) => x.role === role);
      html += `<div class="roster-role"><h3>${ROLE_LABELS[role]} (${slots.length}/${slotCap(role)})</h3>`;
      if (plan) {
        const alloc = Number(plan.alloc[role]) || 0;
        const roleSpent = spentByRole(role);
        const remRole = alloc - roleSpent;
        const progress = alloc ? Math.min(100, Math.round(roleSpent / alloc * 100)) : (roleSpent ? 100 : 0);
        html += `<div class="roster-plan-line">
          <span>Piano ${alloc} · Spesi ${roleSpent}</span>
          <span class="${remRole < 0 ? "over" : ""}">Restano ${remRole}</span>
        </div>
        <div class="plan-progress ${remRole < 0 ? "over" : ""}"><span style="width:${progress}%"></span></div>`;
      }
      for (let i = 0; i < slotCap(role); i++) {
        const s = slots[i];
        if (s) {
          const p = map.get(String(s.id));
          const nome = p ? p.nome : "?";
          const squadra = p ? p.squadra : "";
          html += `<div class="slot filled" data-roster-id="${s.id}">
            <div class="slot-idx">${i + 1}</div>
            <div class="slot-info">
              <div class="slot-name">${escapeHtml(nome)}</div>
              <div class="slot-team">${escapeHtml(squadra)}</div>
            </div>
            <div class="slot-credits">${s.credits}</div>
          </div>`;
        } else {
          html += `<div class="slot">
            <div class="slot-idx">${i + 1}</div>
            <div class="slot-info"><div class="slot-empty">Slot libero</div></div>
          </div>`;
        }
      }
      html += `</div>`;
    }
    $("#rosterBody").innerHTML = html;
  }

  function openRoster() {
    renderRoster();
    $("#rosterOverlay").classList.add("open");
  }
  function closeRoster() {
    $("#rosterOverlay").classList.remove("open");
  }

  function nextPlanName() {
    let n = 1;
    const used = new Set(state.plans.map((plan) => plan.name));
    while (used.has(`Piano ${n}`)) n++;
    return `Piano ${n}`;
  }

  function newPlanId() {
    return `p${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  }

  function formatPct(value) {
    const rounded = Math.round(value * 10) / 10;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
  }

  function renderPlans() {
    const plan = activePlan();
    $("#planChips").innerHTML = state.plans.map((item) =>
      `<button type="button" class="plan-chip ${item.id === state.activePlanId ? "active" : ""}" data-plan-id="${escapeHtml(item.id)}">${escapeHtml(item.name)}</button>`
    ).join("") + `<button type="button" class="plan-chip" id="newPlanBtn">+ Nuovo</button>`;

    if (!plan) {
      $("#planEditor").innerHTML = `<div class="plan-empty">Crea o seleziona un piano per ripartire i ${budget()} crediti.</div>`;
      return;
    }

    const total = ROLES.reduce((sum, role) => sum + (Number(plan.alloc[role]) || 0), 0);
    $("#planEditor").innerHTML = `<div class="plan-editor">
      <input class="plan-name" id="planNameInput" value="${escapeHtml(plan.name)}" maxlength="60" aria-label="Nome piano" />
      <div class="segmented" id="planEditUnit">
        <button type="button" data-unit="cr" class="${state.planEditUnit === "cr" ? "active" : ""}">Crediti</button>
        <button type="button" data-unit="pct" class="${state.planEditUnit === "pct" ? "active" : ""}">%</button>
      </div>
      ${ROLES.map((role) => {
        const alloc = Number(plan.alloc[role]) || 0;
        const inputValue = state.planEditUnit === "cr" ? alloc : formatPct(alloc / budget() * 100);
        const secondary = state.planEditUnit === "cr" ? `${formatPct(alloc / budget() * 100)}%` : `${alloc} cr`;
        return `<div class="plan-row">
          <span class="plan-role">${ROLE_LABELS[role]}</span>
          <input type="number" min="0" step="${state.planEditUnit === "cr" ? "1" : "0.1"}" inputmode="decimal" data-plan-role="${role}" value="${inputValue}" />
          <span class="plan-secondary">${secondary}</span>
        </div>`;
      }).join("")}
      <div class="plan-total ${total === budget() ? "ok" : "bad"}">
        <span>Totale</span><span>${total} / ${budget()}${total === budget() ? "" : " · verifica"}</span>
      </div>
      <button type="button" class="btn danger" id="deletePlanBtn">Elimina piano</button>
    </div>`;
  }

  function openPlans() {
    renderPlans();
    $("#plansOverlay").classList.add("open");
  }

  function closePlans() {
    $("#plansOverlay").classList.remove("open");
  }

  function refreshPlanSurfaces() {
    save();
    updatePlanUi();
    updateRoleTabs();
    renderList();
    if ($("#rosterOverlay").classList.contains("open")) renderRoster();
  }

  function setPlanPercentages() {
    const plan = activePlan();
    if (!plan) return;
    const values = {};
    document.querySelectorAll("[data-plan-role]").forEach((input) => {
      values[input.dataset.planRole] = Math.max(0, Number(input.value) || 0);
    });
    const totalPct = ROLES.reduce((sum, role) => sum + values[role], 0);
    const raw = Object.fromEntries(ROLES.map((role) => [role, values[role] / 100 * budget()]));
    const alloc = Object.fromEntries(ROLES.map((role) => [role, Math.floor(raw[role])]));
    if (Math.abs(totalPct - 100) < 0.001) {
      const largest = ROLES.reduce((best, role) => values[role] > values[best] ? role : best, "P");
      alloc[largest] += budget() - ROLES.reduce((sum, role) => sum + alloc[role], 0);
    } else {
      ROLES.forEach((role) => { alloc[role] = Math.round(raw[role]); });
    }
    plan.alloc = alloc;
  }

  function openTierValueModal(role, key) {
    state.pendingTierRole = role;
    state.pendingTierKey = key;
    const value = tierValue(role, key);
    $("#tierValueTitle").textContent = tierLabel(role, key);
    $("#tierMin").value = value ? value.min : "";
    $("#tierMax").value = value ? value.max : "";
    $("#tierValueRemove").style.display = value ? "" : "none";
    $("#tierValueModal").classList.add("open");
  }

  function closeTierValueModal() {
    $("#tierValueModal").classList.remove("open");
    state.pendingTierRole = null;
    state.pendingTierKey = null;
  }

  function confirmTierValue() {
    const min = Math.max(0, Math.round(Number($("#tierMin").value)));
    const max = Math.max(0, Math.round(Number($("#tierMax").value)));
    if ($("#tierMin").value === "" || $("#tierMax").value === "") {
      toast("Inserisci entrambi i valori");
      return;
    }
    if (min > max) {
      toast("Il valore Da non può superare A");
      return;
    }
    const role = state.pendingTierRole;
    const key = state.pendingTierKey;
    if (!role || key == null) return;
    if (!state.tierValues[role]) state.tierValues[role] = {};
    state.tierValues[role][key] = { min, max };
    save();
    renderList();
    closeTierValueModal();
  }

  function resetAuction() {
    if (!confirm("Azzerare tutta l'asta? Segni, rosa e crediti verranno cancellati.")) return;
    state.flags = {};
    state.roster = [];
    save();
    updateCreditsChip();
    updateRoleTabs();
    renderList();
    if ($("#rosterOverlay").classList.contains("open")) renderRoster();
    toast("Asta azzerata");
  }

  function migrateLegacy300() {
    try {
      if (localStorage.getItem("fantaAstaState_300")) return;
      const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacy) localStorage.setItem("fantaAstaState_300", legacy);
    } catch (_) { /* ignore */ }
  }

  function clearRuntime() {
    state.role = "P";
    state.tool = "taken";
    state.query = "";
    state.showHidden = false;
    state.flags = {};
    state.roster = [];
    state.plans = [];
    state.activePlanId = null;
    state.planUnit = "cr";
    state.tierValues = {};
    state.planEditUnit = "cr";
    state.pendingMineId = null;
    state.editingRosterId = null;
    state.creditInput = "";
    state.pendingTierRole = null;
    state.pendingTierKey = null;
    const search = $("#search");
    if (search) search.value = "";
  }

  function syncModeUi() {
    document.querySelectorAll(".mode-card").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.mode === String(currentMode));
    });
    $("#modeBtn").textContent = currentMode ? `F${currentMode}` : "—";
    document.title = currentMode ? `Asta Fantacalcio ${currentMode}` : "Asta Fantacalcio";
  }

  function hideModeGate() {
    document.body.classList.remove("need-mode");
    $("#modeGate").classList.remove("open");
  }

  function showModeGate(canCancel) {
    syncModeUi();
    $("#modeCancel").style.display = canCancel && currentMode ? "" : "none";
    $("#modeGate").classList.add("open");
    if (!currentMode) document.body.classList.add("need-mode");
  }

  function closeOpenSheets() {
    $("#rosterOverlay").classList.remove("open");
    $("#plansOverlay").classList.remove("open");
    $("#creditsModal").classList.remove("open");
    $("#tierValueModal").classList.remove("open");
  }

  function enterMode(id) {
    if (id !== "300" && id !== "500") return;
    if (currentMode === id) {
      hideModeGate();
      return;
    }
    currentMode = id;
    try { localStorage.setItem(MODE_KEY, id); } catch (_) {}
    if (id === "300") migrateLegacy300();
    clearRuntime();
    load();
    closeOpenSheets();
    hideModeGate();
    syncModeUi();
    updatePlanUi();
    updateRoleTabs();
    updateToolbar();
    updateCreditsChip();
    renderList();
  }

  function savedMode() {
    try {
      const raw = localStorage.getItem(MODE_KEY);
      return raw === "300" || raw === "500" ? raw : null;
    } catch (_) {
      return null;
    }
  }

  // Events
  $("#roleTabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".role-tab");
    if (!btn) return;
    state.role = btn.dataset.role;
    save();
    updateRoleTabs();
    renderList();
    listEl.scrollTop = 0;
  });

  $("#toolbar").addEventListener("click", (e) => {
    const btn = e.target.closest(".tool");
    if (!btn) return;
    state.tool = btn.dataset.tool;
    save();
    updateToolbar();
  });

  listEl.addEventListener("click", (e) => {
    const tier = e.target.closest(".tier-head");
    if (tier) {
      openTierValueModal(tier.dataset.tierRole, tier.dataset.tierKey);
      return;
    }
    const row = e.target.closest(".player");
    if (!row) return;
    applyTool(row.dataset.id);
  });

  $("#search").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderList();
  });
  $("#searchClear").addEventListener("click", () => {
    $("#search").value = "";
    state.query = "";
    renderList();
  });

  $("#creditsChip").addEventListener("click", openRoster);
  $("#closeRoster").addEventListener("click", closeRoster);
  $("#rosterPlanBtn").addEventListener("click", openPlans);
  $("#rosterOverlay").addEventListener("click", (e) => {
    if (e.target === $("#rosterOverlay")) closeRoster();
  });
  $("#rosterBody").addEventListener("click", (e) => {
    const slot = e.target.closest("[data-roster-id]");
    if (!slot) return;
    const map = playerMap();
    const p = map.get(String(slot.dataset.rosterId));
    if (p) openCreditsModal(p, true);
  });

  $("#creditsCancel").addEventListener("click", closeCreditsModal);
  $("#creditsConfirm").addEventListener("click", confirmCredits);
  $("#creditsRemove").addEventListener("click", () => {
    if (state.editingRosterId != null) {
      removeFromRoster(state.editingRosterId);
      save();
      updateCreditsChip();
      updateRoleTabs();
      renderList();
      renderRoster();
      closeCreditsModal();
    }
  });
  $("#creditsModal").addEventListener("click", (e) => {
    if (e.target === $("#creditsModal")) closeCreditsModal();
  });

  $("#plansBtn").addEventListener("click", openPlans);
  $("#activePlanBtn").addEventListener("click", openPlans);
  $("#closePlans").addEventListener("click", closePlans);
  $("#plansOverlay").addEventListener("click", (e) => {
    if (e.target === $("#plansOverlay")) closePlans();
  });
  $("#planUnitBtn").addEventListener("click", () => {
    state.planUnit = state.planUnit === "cr" ? "pct" : "cr";
    refreshPlanSurfaces();
  });
  $("#planChips").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-plan-id]");
    if (chip) {
      state.activePlanId = chip.dataset.planId;
      renderPlans();
      refreshPlanSurfaces();
      return;
    }
    if (e.target.closest("#newPlanBtn")) {
      const plan = {
        id: newPlanId(),
        name: nextPlanName(),
        alloc: { P: 0, D: 0, C: 0, A: 0 },
      };
      state.plans.push(plan);
      state.activePlanId = plan.id;
      state.planEditUnit = "cr";
      renderPlans();
      refreshPlanSurfaces();
    }
  });
  $("#planEditor").addEventListener("click", (e) => {
    const unit = e.target.closest("[data-unit]");
    if (unit) {
      state.planEditUnit = unit.dataset.unit;
      renderPlans();
      return;
    }
    if (e.target.closest("#deletePlanBtn")) {
      const plan = activePlan();
      if (!plan || !confirm(`Eliminare "${plan.name}"?`)) return;
      const idx = state.plans.findIndex((item) => item.id === plan.id);
      state.plans.splice(idx, 1);
      state.activePlanId = state.plans[idx]?.id || state.plans[idx - 1]?.id || null;
      renderPlans();
      refreshPlanSurfaces();
    }
  });
  $("#planEditor").addEventListener("change", (e) => {
    const plan = activePlan();
    if (!plan) return;
    if (e.target.id === "planNameInput") {
      plan.name = e.target.value.trim() || "Piano senza nome";
    } else if (e.target.matches("[data-plan-role]")) {
      if (state.planEditUnit === "pct") {
        setPlanPercentages();
      } else {
        plan.alloc[e.target.dataset.planRole] = Math.max(0, Math.round(Number(e.target.value) || 0));
      }
    } else {
      return;
    }
    renderPlans();
    refreshPlanSurfaces();
  });

  $("#tierValueCancel").addEventListener("click", closeTierValueModal);
  $("#tierValueConfirm").addEventListener("click", confirmTierValue);
  $("#tierValueRemove").addEventListener("click", () => {
    const role = state.pendingTierRole;
    const key = state.pendingTierKey;
    if (role && key != null && state.tierValues[role]) {
      delete state.tierValues[role][key];
      if (!Object.keys(state.tierValues[role]).length) delete state.tierValues[role];
      save();
      renderList();
    }
    closeTierValueModal();
  });
  $("#tierValueModal").addEventListener("click", (e) => {
    if (e.target === $("#tierValueModal")) closeTierValueModal();
  });

  $("#resetBtn").addEventListener("click", resetAuction);
  $("#modeBtn").addEventListener("click", () => showModeGate(true));
  $("#modeCancel").addEventListener("click", hideModeGate);
  $("#modeGate").addEventListener("click", (e) => {
    const card = e.target.closest(".mode-card");
    if (card) enterMode(card.dataset.mode);
  });

  // Schermo intero: disponibile su iPad e desktop, non su iPhone
  const fsTarget = document.documentElement;
  const canFullscreen = !!(fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen);
  const fsBtn = $("#fsBtn");
  if (canFullscreen) {
    fsBtn.style.display = "";
    const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const syncFsLabel = () => { fsBtn.textContent = isFull() ? "Esci schermo intero" : "Schermo intero"; };
    fsBtn.addEventListener("click", () => {
      if (isFull()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen).call(fsTarget);
      }
    });
    document.addEventListener("fullscreenchange", syncFsLabel);
    document.addEventListener("webkitfullscreenchange", syncFsLabel);
  }

  // Funzionamento offline quando la pagina è online (ignorato se aperta come file locale)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  // Init
  buildKeypad();
  $("#dataStampLabel").textContent = PLAYERS.dataStamp || "";
  const initialMode = savedMode();
  if (initialMode) enterMode(initialMode);
  else showModeGate(false);
})();
  </script>
</body>
</html>
